# docker-compose.dev.ban.yml
# Stack DEV BAN — services infra + outils
#
# Points clés:
# - Healthchecks sur RabbitMQ, PostgreSQL, MongoDB et RustFS
# - depends_on avec condition: service_healthy pour mongo-express et pgadmin
# - container_name stables (ban_rabbitmq, ban_postgres, ban_mongo, ban_rustfs, …)

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ban_rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # UI management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
    networks:
      - ban-net

  mongo:
    image: mongo:6
    container_name: ban_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Retourne 1 si OK, on grep 1
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - ban-net

  mongo-express:
    image: mongo-express:1
    container_name: ban_mongo_express
    ports:
      - "8081:8081"
    environment:
      # Utilise le container_name pour éviter les surprises
      ME_CONFIG_MONGODB_SERVER: ban_mongo
      ME_CONFIG_SITE_BASEURL: /
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ban-net

  postgres:
    image: postgis/postgis:17-3.4
    container_name: ban_postgres
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./volumes/postgres-data:/postgres-data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB} -h 127.0.0.1 -p 5432"]
      interval: 2s        # ⏱️ on réduit l’attente
      timeout: 3s         # si pas de réponse en 3s → échec
      retries: 30         # ~1 min max
      start_period: 15s   # laisse Postgres init ses catalogues au début
    restart: unless-stopped
    networks:
      - ban-net


  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ban_pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json
      #- ./config/pgpass:/pgpass # optionnel, pour stocker les mots de passe
    restart: unless-stopped
    networks:
      - ban-net

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: ban_rustfs
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9002}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER:-rustfsadmin}}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-rustfsadmin}}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      ban-net:
        aliases:
          - minio

  rustfs-init:
    image: amazon/aws-cli:2.27.55
    container_name: ban_rustfs_init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER:-rustfsadmin}}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-rustfsadmin}}
      AWS_DEFAULT_REGION: ${EXPORT_S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ${EXPORT_S3_BUCKET:-ban-exports} >/dev/null 2>&1; then
          exit 0
        fi
        aws --endpoint-url http://rustfs:9000 s3 mb s3://${EXPORT_S3_BUCKET:-ban-exports}
    restart: "no"
    networks:
      - ban-net

volumes:
  mongo_data:
  pg_data:
  rustfs_data:

networks:
  ban-net:
    driver: bridge
