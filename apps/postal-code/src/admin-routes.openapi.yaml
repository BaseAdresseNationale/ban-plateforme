paths:
  /postal-code/postal-datanova:
    put:
      summary: Modifier les codes postaux et libellés des communes existantes
      description: |
        Disponible uniquement avec POSTAL_CODE_ADMIN_ENABLED=true ; sinon route absente (404).
        Corps JSON de 2 Mio maximum. Toutes les entrées sont validées avant la première écriture.
        Chaque commune est traitée dans sa propre transaction ; aucune création implicite.
        Un résultat 207 peut contenir des modifications déjà appliquées et des échecs.
        Les contours ne sont pas modifiés. updatedBy/updateNote sont acceptés pour compatibilité,
        sans stockage ni audit ; ils ne constituent pas une autorisation.
        Une perte de confirmation COMMIT donne 503 : l'état peut être indéterminé,
        et les communes précédentes du lot peuvent avoir été modifiées.
      security:
        - PostalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/DatanovaUpdate'
      responses:
        '200':
          description: Toutes les communes demandées ont été modifiées.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      response:
                        type: object
                        required: [totalUpdated]
                        additionalProperties: false
                        properties:
                          totalUpdated:
                            type: integer
                            minimum: 1
                            maximum: 100
        '207':
          description: Au moins une commune absente ou en échec ; consulter failedUpdates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      response:
                        type: object
                        required: [totalUpdated, failedUpdates]
                        additionalProperties: false
                        properties:
                          totalUpdated:
                            type: integer
                            minimum: 0
                            maximum: 99
                          failedUpdates:
                            type: array
                            minItems: 1
                            maxItems: 100
                            items:
                              type: object
                              required: [inseeCom, updatedRowsCount]
                              additionalProperties: false
                              properties:
                                inseeCom:
                                  $ref: '#/components/schemas/InseeCode'
                                updatedRowsCount:
                                  const: 0
                                error:
                                  const: Database update failed
        '400':
          $ref: '#/components/responses/InvalidUpdate'
        '401':
          $ref: '../openapi.yaml#/paths/~1postal-code~1long-lat-insee-com/get/responses/401'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedContent'
        '503':
          $ref: '#/components/responses/WriteUnavailable'
components:
  responses:
    InvalidUpdate:
      description: JSON, paramètres ou valeurs invalides ; aucune écriture.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: Corps JSON supérieur à la limite de la route ; aucune écriture.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    UnsupportedContent:
      description: application/json obligatoire ; encodage non pris en charge.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    WriteUnavailable:
      description: Stockage indisponible ou résultat COMMIT indéterminé ; aucun faux succès.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  schemas:
    InseeCode:
      type: string
      pattern: '^(?:[0-9]{5}|2[AB][0-9]{3})$'
      minLength: 5
      maxLength: 5
    DatanovaUpdate:
      type: object
      additionalProperties: false
      required: [inseeCom, postalCodes, libelleAcheminementWithPostalCodes]
      properties:
        inseeCom:
          $ref: '#/components/schemas/InseeCode'
        postalCodes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            pattern: '^[0-9]{5}$'
        libelleAcheminementWithPostalCodes:
          description: Exactement un libellé non vide par code déclaré ; aucun autre code.
          type: object
          minProperties: 1
          maxProperties: 1000
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 512
        updatedBy:
          description: Compatibilité uniquement ; non enregistré et non utilisé pour autoriser.
          type: string
          minLength: 1
          maxLength: 255
        updateNote:
          description: Compatibilité uniquement ; non enregistrée.
          type: string
          maxLength: 2000
