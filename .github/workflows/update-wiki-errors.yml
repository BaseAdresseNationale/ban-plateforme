name: Update Wiki Errors Board

on:
  schedule:
    - cron: '0 * * * *'  # Toutes les heures sur master uniquement
  workflow_dispatch:  # Lancement manuel
  pull_request:  # Se lance sur les PR pour tester
    branches:
      - master

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki
      
      - name: Fetch errors and generate board
        id: errors_board
        run: |
          echo "generated=false" >> "$GITHUB_OUTPUT"

          # Récupérer les données
          if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "https://plateforme.adresse.data.gouv.fr/api/alerts/errors-summary?limit=500" \
            --output errors.json; then
            echo "::warning::Erreur lors de la récupération des données de la plateforme. Mise à jour du wiki ignorée."
            exit 0
          fi

          if ! jq -e '.response.communes | type == "array"' errors.json > /dev/null; then
            echo "::warning::Réponse de la plateforme invalide. Mise à jour du wiki ignorée."
            exit 0
          fi
          
          # Date de mise à jour
          TIMESTAMP=$(date -u +"%d/%m/%Y à %H:%M:%S UTC")
          
          # Compter les erreurs
          TOTAL=$(jq '.response.communes | length' errors.json)
          
          # Créer le tableau
          cat > wiki/Errors-Board.md << 'EOF'
          # 🚨 Errors Board
          
          EOF
          
          echo "**Dernière mise à jour :** ${TIMESTAMP}" >> wiki/Errors-Board.md
          echo "" >> wiki/Errors-Board.md
          echo "**Dernière mise à jour du markdown :** ${TIMESTAMP}" >> wiki/Errors-Board.md
          echo "" >> wiki/Errors-Board.md
          echo "**Total :** ${TOTAL} erreurs" >> wiki/Errors-Board.md
          echo "" >> wiki/Errors-Board.md
          echo "| Commune | COG | Date | Message d'erreur |" >> wiki/Errors-Board.md
          echo "|---------|-----|------|------------------|" >> wiki/Errors-Board.md
          
          # Fonction de parsing en jq (similaire au code React)
          if ! jq -r '.response.communes[] | 
          . as $item |
          ($item.message | ascii_downcase) as $lower |
          
          # Parser le message
          (if ($lower | contains("job") and contains("échoué")) then
            if ($item.message | contains("updateDate is a required field")) then
              "🔴 Date mise à jour manquante"
            else
              "🔴 Erreur interne - contacter le support"
            end
          elif ($lower | contains("droits manquants")) then
            "🔴 Droits manquants"
          elif ($lower | contains("opération non autorisée")) then
            "🔴 Opération non autorisée - Identifiants déjà utilisés"
          elif ($lower | contains("seuil de suppression") or contains("exceeded")) then
            "🔴 Seuil de suppression dépassé"
          elif ($lower | contains("addressid manquant")) then
            "🔴 addressID manquant - Consulter rapport de validation"
          elif ($lower | contains("districtid manquant")) then
            "🔴 districtID manquant - Consulter rapport de validation"
          elif ($lower | contains("maintopoid manquant")) then
            "🔴 mainTopoID manquant - Consulter rapport de validation"
          elif ($lower | contains("ids manquants")) then
            "🔴 IDs manquants - Consulter rapport de validation"
          elif ($lower | contains("enregistrement de la bal sans les identifiants")) then
            "🔴 Enregistrement sans identifiants - Consulter rapport"
          elif ([$lower | contains("api ban"), contains("api dump"), contains("timeout")] | any) then
            "🔴 Erreur interne - contactez le support"
          else
            "🔴 " + ($item.message | split("\n")[0] | .[0:80])
          end) as $parsed |
          
          "| \($item.districtName) | `\($item.cog)` | \($item.createdAt[0:10]) | \($parsed) |"
          ' errors.json >> wiki/Errors-Board.md; then
            echo "::warning::Erreur lors du traitement des données de la plateforme. Mise à jour du wiki ignorée."
            exit 0
          fi

          echo "generated=true" >> "$GITHUB_OUTPUT"
      
      # Ne commit que sur master (pas sur les PR)
      - name: Commit and push
        if: github.ref == 'refs/heads/master' && steps.errors_board.outputs.generated == 'true'
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Errors-Board.md
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Mise à jour automatique du board"
            git push
          )
      
      # Affiche juste un aperçu sur les PR
      - name: Preview on PR
        if: github.event_name == 'pull_request' && steps.errors_board.outputs.generated == 'true'
        run: |
          echo "✅ Le board a été généré avec succès !"
          echo "Aperçu des 5 premières lignes :"
          head -n 15 wiki/Errors-Board.md
